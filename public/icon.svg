<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#334155" stroke-width="3" opacity="0.6"/>

  <!-- Open Book & Wave Symbol -->
  <!-- Left page -->
  <path d="M 256 190 C 230 160 170 160 130 170 C 120 172 110 182 110 195 L 110 335 C 110 345 120 355 130 352 C 170 342 225 345 256 370 Z" 
        fill="#334155" opacity="0.5"/>
  <!-- Right page -->
  <path d="M 256 190 C 282 160 342 160 382 170 C 392 172 402 182 402 195 L 402 335 C 402 345 392 355 382 352 C 342 342 287 345 256 370 Z" 
        fill="#1e293b" opacity="0.8"/>

  <!-- Center spine line -->
  <line x1="256" y1="185" x2="256" y2="370" stroke="#475569" stroke-width="4" stroke-linecap="round"/>

  <!-- Dynamic Sound Waves (Over book) -->
  <rect x="176" y="240" width="12" height="50" rx="6" fill="url(#accentGrad)"/>
  <rect x="206" y="215" width="12" height="100" rx="6" fill="url(#accentGrad)"/>
  <rect x="236" y="195" width="12" height="140" rx="6" fill="url(#glowGrad)"/>
  <rect x="264" y="195" width="12" height="140" rx="6" fill="url(#glowGrad)"/>
  <rect x="294" y="215" width="12" height="100" rx="6" fill="url(#accentGrad)"/>
  <rect x="324" y="240" width="12" height="50" rx="6" fill="url(#accentGrad)"/>

  <!-- Headphones Arc -->
  <path d="M 120 256 A 136 136 0 0 1 392 256" fill="none" stroke="url(#glowGrad)" stroke-width="16" stroke-linecap="round"/>
  <!-- Headphone ear cups -->
  <rect x="104" y="240" width="28" height="60" rx="12" fill="#38bdf8"/>
  <rect x="380" y="240" width="28" height="60" rx="12" fill="#38bdf8"/>
</svg>
